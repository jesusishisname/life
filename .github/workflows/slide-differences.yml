name: Convert Google Slides to Differences PPTX

on:
  workflow_dispatch:
    inputs:
      slides_url:
        description: Publicly viewable Google Slides presentation URL
        required: true
        type: string

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install free dependencies
        run: python -m pip install --upgrade pymupdf pillow python-pptx requests

      - name: Convert slides and create difference deck
        env:
          SLIDES_URL: ${{ inputs.slides_url }}
        run: python scripts/slide_differences.py

      - name: Save PPTX to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/slide-differences.pptx
          if git diff --cached --quiet; then
            echo "The generated PPTX is unchanged."
          else
            git commit -m "Generate slide differences PPTX"
            git push
          fi
